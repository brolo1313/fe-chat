services:
  # MongoDB Database
  mongodb:
    image: mongo:7.0
    container_name: chat-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: chat
    volumes:
      - mongodb_data:/data/db
    networks:
      - chat-network

  # Backend API
  backend:
    build:
      context: ../be-chat
      dockerfile: Dockerfile
    container_name: chat-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - MONGODB_URI=mongodb://mongodb:27017/chat
      - PORT=3000
    volumes:
      - ../be-chat:/app
      - /app/node_modules
    depends_on:
      - mongodb
    networks:
      - chat-network

  # Frontend Angular App
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: chat-frontend
    restart: unless-stopped
    ports:
      - "4202:4202"
    environment:
      - NODE_ENV=development
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - chat-network

networks:
  chat-network:
    driver: bridge

volumes:
  mongodb_data:
